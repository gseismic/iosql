[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iosql"
dynamic = ["version"]
description = "Partitioned SQLite storage for time-series data"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Liu Shengli", email = "liushengli203@163.com" }
]
dependencies = [
    "arrow",
    "typer>=0.9.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
postgresql = [
    "psycopg2-binary>=2.9",
]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
# 兼容别名：iosql[ui] 曾是唯一 extra 名，内容与 [web] 相同
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.urls]
Homepage = "http://github.com/gseismic/iosql"
Repository = "http://github.com/gseismic/iosql"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
"iosql.web" = ["static/*", "static/js/*", "static/vendor/*"]

[tool.setuptools.dynamic]
version = { attr = "iosql.version.__version__" }

[tool.setuptools.packages.find]
include = ["iosql*"]

[project.scripts]
iosql = "iosql.cli:app"
