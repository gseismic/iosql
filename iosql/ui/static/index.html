<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iosql UI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2345c6ff'/%3E%3Cpath d='M4 4h8v3H7v2h5v3H4V9h5V7H4z' fill='%230a0d13'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/uplot.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 顶栏：品牌 | DB URI 只读展示 | 模式徽章（app.js 填充） -->
  <header id="topbar">
    <div class="brand">
      <div class="brand-mark"></div>
      <span class="brand-name">iosql<em>UI</em></span>
    </div>
    <span id="db-uri" title="">正在连接…</span>
    <div class="topbar-right">
      <span id="mode-badge-slot"></span>
      <span class="kbd-hints">
        <span><kbd>1</kbd>–<kbd>6</kbd> 切 Tab</span>
        <span><kbd>←</kbd><kbd>→</kbd> 翻页</span>
        <span><kbd>R</kbd> 刷新</span>
      </span>
    </div>
  </header>

  <div id="layout">
    <!-- 左侧栏：总览入口 + 表列表（app.js 填充） -->
    <nav id="sidebar" aria-label="表列表"></nav>

    <!-- 主区：Tab 栏 + 工作区 -->
    <main id="main">
      <div id="tabbar" role="tablist"></div>
      <div id="content"></div>
    </main>
  </div>

  <!-- 单元格详情侧滑面板 -->
  <div id="detail-mask"></div>
  <aside id="detail-panel" aria-label="单元格详情">
    <div class="detail-head">
      <span class="micro-label">单元格详情 · <span class="detail-colname" id="detail-colname"></span></span>
      <button class="btn sm ghost" id="detail-copy">复制值</button>
      <button class="icon-btn" id="detail-close" title="关闭 (Esc)">✕</button>
    </div>
    <div class="detail-body"><pre id="detail-pre"></pre></div>
  </aside>

  <!-- 弹窗挂载点 / Toast 挂载点 -->
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <!-- 零构建链：顺序 script 标签（defer 保持执行顺序），全局命名空间 IU -->
  <script src="vendor/uplot.min.js"></script>
  <script src="js/util.js" defer></script>
  <script src="js/components.js" defer></script>
  <script src="js/tab-overview.js" defer></script>
  <script src="js/tab-browse.js" defer></script>
  <script src="js/tab-structure.js" defer></script>
  <script src="js/tab-query.js" defer></script>
  <script src="js/tab-charts.js" defer></script>
  <script src="js/tab-maintain.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
